overlay: 1.0.0
info:
  title: API keys only, Twinbay branding
  version: 0.0.1
actions:
  # The API accepts either a WorkOS access token or an organization API key. A
  # browser can get the former; a terminal cannot, so the CLI only offers keys.
  - target: $.paths.*.*.security[0]
    description: Drop the WorkOS access token option from every operation.
    remove: true
  - target: $.components.securitySchemes['Access token']
    description: Drop the now-unreferenced access token scheme.
    remove: true

  # The upstream spec still carries the pre-rebrand name and host. Drop these
  # two actions once api.twinbay.ai serves them itself.
  - target: $.info
    description: Rebrand Semva to Twinbay.
    update:
      title: Twinbay
  - target: $.servers[0]
    description: Point the default server at the Twinbay host.
    update:
      url: https://api.twinbay.ai
